<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Demo</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:white;
            color:black;
        }

        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 60px;
            border-bottom:1px solid #ddd;
        }

        .logo{
            font-size:24px;
            font-weight:bold;
        }

        .container{
            min-height:80vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        h1{
            font-size:48px;
            margin-bottom:20px;
        }

        p{
            color:#666;
            margin-bottom:30px;
        }

        form{
            display:flex;
            gap:10px;
            width:100%;
            max-width:600px;
        }

        input{
            flex:1;
            padding:14px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            padding:14px 24px;
            border:none;
            background:black;
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            opacity:0.8;
        }

        .result{
            margin-top:40px;
            width:100%;
            max-width:600px;
            border:1px solid #ddd;
            border-radius:12px;
            padding:20px;
        }

        .result h3{
            margin-bottom:10px;
        }

        footer{
            text-align:center;
            padding:30px;
            border-top:1px solid #ddd;
            color:#777;
        }

    </style>

</head>

<body>

    <nav>
        <div class="logo">AppSec CI Pipeline</div>
    </nav>

    <div class="container">

        <h1>Search Testing Portal</h1>

        <p>
            Search functionality used for security testing demonstrations.
        </p>

        <form>

            <input
                type="text"
                name="q"
                placeholder="Enter search term"
            >

            <button type="submit">
                Search
            </button>

        </form>

        {% if query %}

        <div class="result">

            <h3>Search Result</h3>

            <p>
                You searched for:
                <strong>{{ query }}</strong>
            </p>

        </div>

        {% endif %}

    </div>

    <footer>
        AppSec CI Pipeline • Search Module
    </footer>

</body>
</html>
